<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avito CPA Watch</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Avito CPA Watch 1.3</h1>
    <div class="card">
      <div class="row"><span>Аванс</span><strong id="balance">—</strong></div>
      <div class="row"><span>Порог</span><strong id="threshold">—</strong></div>
      <div class="row"><span>Состояние</span><strong id="state">—</strong></div>
      <div class="row"><span>cpaAlert</span><strong id="alert">—</strong></div>
      <div class="row"><span>Проверено</span><strong id="checked">—</strong></div>
    </div>

    <div id="error" class="error hidden"></div>

    <button id="check">Проверить сейчас</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
